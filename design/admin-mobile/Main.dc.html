<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    a { color: #4A6BF5; } a:hover { color: #2C46B8; }
    .seat { width: 34px; height: 34px; border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; box-sizing: border-box; }
    .sn { width: 100%; text-align: center; font-size: 7px; font-weight: 500; line-height: 8px; opacity: .75; }
    .snm { width: 100%; text-align: center; font-size: 8px; font-weight: 700; line-height: 9px; margin-top: 2px; }
    .row { display: flex; gap: 6px; align-items: center; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #EDF1F9; display: flex; flex-direction: column; box-sizing: border-box;">

  <!-- 상단: 이벤트 + 상태 한 줄 -->
  <div style="background: #FFFFFF; padding: 10px 14px; display: flex; align-items: center; gap: 9px; box-shadow: 0 1px 0 #E3E9F6;">
    <div style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: #4A6BF5; color: #fff; font-size: 13px; font-weight: 800; flex-shrink: 0;">전</div>
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
      <span style="font-size: 13.5px; font-weight: 800; color: #171C2E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">2026 공감 모임</span>
      <span style="font-size: 10.5px; font-weight: 700; color: #1BA35C;">● 활성 · 참가자 접속 중</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 11px; background: #F1F4FB; color: #6C7590; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="12" cy="19" r="1.4" />
      </svg>
    </div>
  </div>

  <!-- 탭 -->
  <div style="display: flex; gap: 7px; padding: 11px 14px 0;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 46px; border-radius: 14px; background: #4A6BF5; color: #fff; font-size: 14.5px; font-weight: 800; box-shadow: 0 6px 16px rgba(74,107,245,.28);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.8" y="4" width="18.4" height="13" rx="2.6" /><path d="M6.6 11.2 9 8.8l2.4 3.2 2.4-3.6 2.6 2.8" /><path d="M9.5 20.5h5" />
      </svg>
      <span>좌석표</span>
    </div>
    <div style="position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 46px; border-radius: 14px; background: #FFFFFF; color: #6C7590; font-size: 14.5px; font-weight: 700;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-2.8-.4L3 21l1.6-4.6A8.2 8.2 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z" />
      </svg>
      <span>채팅</span>
      <span style="position: absolute; top: 6px; right: 26px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #E24B45; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">3</span>
    </div>
  </div>

  <!-- 진행 상태 -->
  <div style="margin: 11px 14px 0; padding: 11px 14px; border-radius: 16px; background: #4A6BF5; color: #fff; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(74,107,245,.24);">
    <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 11px; font-weight: 800; flex-shrink: 0;">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #fff;"></span>진행 중
    </span>
    <span style="font-size: 14px; font-weight: 800; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">2그룹 2번째 임재현님</span>
    <span style="font-size: 17px; font-weight: 800; flex-shrink: 0;">02:01</span>
  </div>

  <!-- 좌석표: 화면 폭에 맞춰 전체가 한눈에 -->
  <div style="margin: 11px 14px 0; padding: 12px 10px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(23,35,66,.06);">
    <div style="height: 30px; border-radius: 10px; background: #EEF2FB; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; letter-spacing: .22em; color: #9AA4BE; margin-bottom: 11px;">STAGE</div>

    <div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div class="row">
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">A-1</span></div>
        <div class="seat" style="background:#8E2C43;color:#fff;"><span class="sn">A-2</span><span class="snm">강태현</span></div>
        <div class="seat" style="background:#8E2C43;color:#fff;"><span class="sn">A-3</span><span class="snm">정우진</span></div>
        <div class="seat" style="background:#8E2C43;color:#fff;"><span class="sn">A-4</span><span class="snm">이준호</span></div>
        <div style="width:16px;"></div>
        <div class="seat" style="background:#8E2C43;color:#fff;"><span class="sn">A-5</span><span class="snm">박민지</span></div>
        <div class="seat" style="background:#7B5AD1;color:#fff;"><span class="sn">A-6</span><span class="snm">윤소희</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">A-7</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">A-8</span></div>
      </div>
      <div class="row">
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">B-1</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">B-2</span></div>
        <div class="seat" style="background:#8E2C43;color:#fff;"><span class="sn">B-3</span><span class="snm">김서연</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">B-4</span></div>
        <div style="width:16px;"></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">B-5</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">B-6</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">B-7</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">B-8</span></div>
      </div>
      <div class="row">
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">C-1</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">C-2</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">C-3</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">C-4</span></div>
        <div style="width:16px;"></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">C-5</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">C-6</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">C-7</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">C-8</span></div>
      </div>
      <div class="row">
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">D-1</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">D-2</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">D-3</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">D-4</span></div>
        <div style="width:16px;"></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">D-5</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">D-6</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">D-7</span></div>
        <div class="seat" style="background:#DDE4F2;color:#7C86A0;"><span class="sn">D-8</span></div>
      </div>
    </div>

    <div style="display: flex; justify-content: center; gap: 13px; margin-top: 12px; padding-top: 11px; border-top: 1px solid #EBF0FA; font-size: 10.5px; font-weight: 700; color: #6C7590;">
      <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="width:10px;height:10px;border-radius:4px;background:#D3D7E0;"></span>선택 불가</span>
      <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="width:10px;height:10px;border-radius:4px;background:#DDE4F2;"></span>선택 가능</span>
      <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="width:10px;height:10px;border-radius:4px;background:#00BFD0;"></span>직전 선택</span>
    </div>
  </div>

  <p style="margin: 10px 18px 0; font-size: 11.5px; font-weight: 500; color: #8791AB; text-align: center; line-height: 1.5;">빈 좌석을 누르면 추가신청자를 배정할 수 있습니다</p>

</div>
</x-dc>
</body>
</html>
