<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    a { color: #4A6BF5; } a:hover { color: #2C46B8; }
    .meta { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .who { font-size: 12px; font-weight: 700; color: #6C7590; }
    .when { font-size: 11px; font-weight: 500; color: #A2AAC0; }
    .bubble { padding: 10px 14px; font-size: 14px; font-weight: 500; line-height: 1.45; max-width: 74%; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #EDF1F9; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="background: #FFFFFF; padding: 10px 14px; display: flex; align-items: center; gap: 9px; box-shadow: 0 1px 0 #E3E9F6;">
    <div style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: #4A6BF5; color: #fff; font-size: 13px; font-weight: 800; flex-shrink: 0;">전</div>
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
      <span style="font-size: 13.5px; font-weight: 800; color: #171C2E;">2026 공감 모임</span>
      <span style="font-size: 10.5px; font-weight: 700; color: #1BA35C;">● 활성 · 참가자 접속 중</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 11px; background: #F1F4FB; color: #6C7590; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="12" cy="19" r="1.4" />
      </svg>
    </div>
  </div>

  <div style="display: flex; gap: 7px; padding: 11px 14px 0;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 46px; border-radius: 14px; background: #FFFFFF; color: #6C7590; font-size: 14.5px; font-weight: 700;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.8" y="4" width="18.4" height="13" rx="2.6" /><path d="M6.6 11.2 9 8.8l2.4 3.2 2.4-3.6 2.6 2.8" /><path d="M9.5 20.5h5" />
      </svg>
      <span>좌석표</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 46px; border-radius: 14px; background: #4A6BF5; color: #fff; font-size: 14.5px; font-weight: 800; box-shadow: 0 6px 16px rgba(74,107,245,.28);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-2.8-.4L3 21l1.6-4.6A8.2 8.2 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z" />
      </svg>
      <span>채팅</span>
    </div>
  </div>

  <!-- 채팅: 남는 높이를 전부 쓴다 -->
  <div style="flex-grow: 1; margin: 11px 14px 0; border-radius: 20px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(23,35,66,.06); display: flex; flex-direction: column; overflow: hidden;">

    <div style="flex-grow: 1; padding: 16px 15px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: flex-start;">
        <div class="meta"><span class="who">최유나</span><span class="when">9/14, 오후 2:30</span></div>
        <div class="bubble" style="background: #F1F4FB; color: #2A3350; border-radius: 15px 15px 15px 4px;">질문 있습니다</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start;">
        <div class="meta"><span class="who">최유나</span><span class="when">9/14, 오후 2:30</span></div>
        <div class="bubble" style="background: #F1F4FB; color: #2A3350; border-radius: 15px 15px 15px 4px;">지금 도착했는데 자리가 어디인가요?</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end;">
        <div class="meta">
          <span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; background: #FFF0E6; color: #D2652C; font-size: 11px; font-weight: 800;">관리자</span>
          <span class="when">9/14, 오후 2:31</span>
        </div>
        <div class="bubble" style="background: #4A6BF5; color: #fff; border-radius: 15px 15px 4px 15px;">A-5로 배정해드렸습니다</div>
      </div>
    </div>

    <div style="display: flex; gap: 9px; align-items: center; padding: 11px 12px; border-top: 1px solid #EBF0FA;">
      <div style="flex-grow: 1; height: 46px; border-radius: 999px; background: #F1F4FB; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 500; color: #A2AAC0;">메시지를 입력하세요</div>
      <div style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 50%; background: #4A6BF5; display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12h14" /><path d="M12.5 5.5 19 12l-6.5 6.5" />
        </svg>
      </div>
    </div>

  </div>

  <div style="height: 14px;"></div>

</div>
</x-dc>
</body>
</html>
